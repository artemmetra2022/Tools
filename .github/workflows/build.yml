name: Build Mod

# Запускаем сборку при каждом пуше и при каждом Pull Request
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch: {}   # позволяет запустить сборку вручную из вкладки Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # В репозитории уже есть gradlew / gradlew.bat / gradle-wrapper.properties,
      # но самого бинарника gradle-wrapper.jar нет (его нельзя было сгенерировать
      # без доступа в интернет при создании проекта). Этот шаг ставит настоящий
      # Gradle через официальный action и сам генерирует недостающий jar.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradle-wrapper.jar exists
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar not found, generating via installed Gradle..."
            gradle wrapper --gradle-version 8.8
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Upload built jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: clearitems-jar
          path: build/libs/*.jar
          if-no-files-found: error
